<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Open Ovis — Midsagittal Atlas</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<script>
  // The atlas is now one page driven by ?view=, so marker coordinates live in
  // data/<view>.json instead of being duplicated per page. Old links land
  // here; carry the query string (?off= or inc_* flags) across.
  (function () {
    var qs = window.location.search;                 // "" or "?inc_x=0&..."
    var extra = qs.length > 1 ? '&' + qs.slice(1) : '';
    window.location.replace('../atlas.html?view=midsagittal' + extra);
  })();
</script>
<meta http-equiv="refresh" content="0; url=../atlas.html?view=midsagittal">
</head>
<body style="font:15px/1.5 system-ui,sans-serif;padding:40px;color:#1a1d29">
  <p>The midsagittal atlas has moved to
     <a href="../atlas.html?view=midsagittal">atlas.html?view=midsagittal</a>.</p>
</body>
</html>
