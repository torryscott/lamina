<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Embed preview — Sheep Brain Study Guide</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<style>
  body { margin:0; font:15px/1.5 system-ui,-apple-system,sans-serif; background:#f4f6f9; color:#1a1d29; }
  .note {
    background:#1e3a5f; color:#fff; padding:10px 18px; font-size:.86rem;
    display:flex; gap:14px; align-items:center; flex-wrap:wrap;
  }
  .note b { font-weight:600; }
  .note code { background:rgba(255,255,255,.15); padding:1px 6px; border-radius:3px; font-size:.9em; }
  .note .sp { flex:1; }
  .note a { color:#cfe0f5; }
  /* Rough stand-in for Qualtrics' own page chrome, so the embed is judged
     inside a container of realistic width rather than the full viewport. */
  .qchrome { max-width: 752px; margin: 0 auto; padding: 26px 16px 60px; }
  #host { background:#fff; border-radius:4px; padding:18px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  #err { color:#a33f3a; padding:16px 18px; font-family:ui-monospace,monospace; white-space:pre-wrap; }
</style>
</head>
<body>

<div class="note">
  <b>Embed preview</b>
  <span>Loads <code>midsagittal.html</code> + <code>midsagittal.js</code> with a stubbed
        <code>Qualtrics.SurveyEngine</code>, inside a Qualtrics-width container.</span>
  <span class="sp"></span>
  <span>Not the real survey — check the live one before shipping.</span>
</div>

<div class="qchrome"><div id="host"></div></div>
<div id="err"></div>

<script>
// Minimal stand-in for the bits of the Qualtrics API the embed touches.
window.Qualtrics = {
  SurveyEngine: {
    _ready: [],
    addOnload:  function (fn) { this._ready.push(fn); },
    addOnReady: function (fn) { this._ready.push(fn); },
    addOnUnload: function () {},
    _run: function (host) {
      var ctx = { getQuestionContainer: function () { return host; } };
      this._ready.forEach(function (fn) {
        try { fn.call(ctx); }
        catch (e) { document.getElementById('err').textContent += 'Embed script threw: ' + e + '\n'; }
      });
    }
  }
};

(async function () {
  var host = document.getElementById('host');
  var err  = document.getElementById('err');
  try {
    host.innerHTML = await (await fetch('midsagittal.html')).text();
    var js = await (await fetch('midsagittal.js')).text();
    // eslint-disable-next-line no-new-func
    new Function(js)();
    Qualtrics.SurveyEngine._run(host);
  } catch (e) {
    err.textContent = 'Could not load the embed: ' + e + '\n' +
      'Serve the repo over HTTP — fetch() is blocked on file:// URLs.\n' +
      '  python3 scripts/serve.py';
  }
})();
</script>
</body>
</html>
