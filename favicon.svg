<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sheep Brain Study Guide">
  <title>Sheep Brain Study Guide</title>
  <style>
    /* Navy to match the site accent; lightened against dark browser chrome. */
    .ink { stroke: #1e3a5f; }
    @media (prefers-color-scheme: dark) { .ink { stroke: #9db8d6; } }
  </style>
  <!-- A brain in profile, drawn as squiggles. Few and bold so it still reads at 16px. -->
  <g class="ink" fill="none" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- outer contour: cerebrum, with the cerebellum tucked lower right -->
    <path d="M21 13.5c-6.4 1-10.5 5.4-10.5 10.8 0 2.2.7 4.2 1.9 5.8-2 1.9-3.2 4.5-3.2 7.3 0 4 2.4 7.4 6 9-.2.8-.3 1.7-.3 2.6 0 4.9 4.2 8.5 9.6 8.5 3.2 0 6-1.3 7.9-3.4 2 1.5 4.6 2.4 7.4 2.4 7 0 12.7-5.1 12.7-11.4 0-2.2-.7-4.2-1.9-5.9 1.8-2 2.9-4.5 2.9-7.2 0-4.2-2.5-7.8-6.2-9.6-.6-6-6-10.6-12.6-10.6-2.7 0-5.2.8-7.3 2.2-2.1-1.6-4.8-2.4-7.4-2.5Z"/>
    <!-- the midline fold -->
    <path d="M31.8 15.4c-1.2 3-.6 5.4 1.7 7.2 2.3 1.8 2.8 4.2 1.5 7.2"/>
    <!-- gyri: two each side, enough to read as folds without closing up -->
    <path d="M19.5 24c2.7-2.2 5.3-1.8 7.7 1.1"/>
    <path d="M18 36.4c3.4-2.4 6.5-1.9 9.3 1.4"/>
    <path d="M44.5 26c-3-1-5.3.1-6.9 3.1"/>
    <path d="M46 38c-3.3-.8-5.8.6-7.5 4.1"/>
    <!-- brainstem -->
    <path d="M37.5 50.5c.7 2.7 2.2 4.5 4.6 5.4"/>
  </g>
</svg>
